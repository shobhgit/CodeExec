services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codeexec-backend
    restart: always
    volumes:
      # Mount host Docker socket so backend can run sandboxed execution containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount host /tmp so temporary files created by backend map directly to host filesystem
      - /tmp:/tmp
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EXECUTION_TIMEOUT_SECONDS=60

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeexec-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
